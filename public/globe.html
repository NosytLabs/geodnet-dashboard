<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GEODNET · 3D Globe View</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%230ea5e9'/><path d='M30 50 L70 50 M50 30 L50 70' stroke='white' stroke-width='8' stroke-linecap='round'/></svg>" type="image/svg+xml">
<script src="vendor/plotly-2.35.2.min.js"></script>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --muted:#94a3b8; --fg:#f8fafc; --gps:#22c55e; --glo:#f59e0b; --gal:#8b5cf6; --bds:#ef4444; --up:#38bdf8; --gnss:#22c55e; --wifi:#f59e0b; }
  * { box-sizing:border-box }
  body { margin:0; font:14px system-ui,-apple-system,Segoe UI,Roboto; background:var(--bg); color:var(--fg); min-height:100vh; overflow:hidden; }
  header { padding:12px 20px; border-bottom:1px solid rgba(148,163,184,.15); background:rgba(15,23,42,.95); position:sticky; top:0; z-index:10; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  h1 { margin:0; font-size:16px; font-weight:600; }
  .header-nav { display:flex; gap:8px; margin-left:auto; }
  .header-nav a { text-decoration:none; padding:6px 12px; font-size:12px; background:rgba(30,41,59,.9); color:#e2e8f0; border:1px solid rgba(148,163,184,.3); border-radius:6px; transition:background .15s,border-color .15s; }
  .header-nav a:hover { background:rgba(51,65,85,.95); border-color:#38bdf8; }
  .header-nav a.active { background:#0ea5e9; border-color:#0ea5e9; color:#082f49; }
  main { padding:0; height:calc(100vh - 60px); display:flex; flex-direction:column; }
  #globe3d { flex:1; width:100%; height:100%; }
  .panel {
    position:absolute; bottom:12px; left:12px; right:12px;
    background:rgba(15,23,42,.92); border:1px solid rgba(148,163,184,.25);
    border-radius:12px; padding:10px 14px; z-index:1000;
    display:flex; gap:12px; flex-wrap:wrap; align-items:center;
    font:13px system-ui; color:#e2e8f0;
  }
  .stat { display:flex; flex-direction:column; min-width:85px; }
  .stat .label { color:#94a3b8; font-size:10px; text-transform:uppercase; letter-spacing:.04em; }
  .stat .value { font-size:15px; font-weight:600; color:#f8fafc; }
  .stat.gps .value { color:#22c55e; }
  .stat.glo .value { color:#f59e0b; }
  .stat.gal .value { color:#8b5cf6; }
  .stat.bds .value { color:#ef4444; }
  #legend { position:absolute; bottom:90px; left:12px; background:rgba(15,23,42,.9); border:1px solid rgba(148,163,184,.25); border-radius:8px; padding:8px 12px; z-index:1000; font:11px system-ui; color:#e2e8f0; display:none; }
  #legend .row { display:flex; align-items:center; gap:6px; margin:2px 0; }
  #legend .dot { width:8px; height:8px; border-radius:50%; }
  .loading { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); color:var(--muted); font-size:14px; z-index:100; }
</style>
</head>
<body>
<header>
  <h1>GEODNET · 3D Globe View</h1>
  <nav class="header-nav">
    <a href="/" id="nav3d" class="active">3D Globe</a>
    <a href="/" onclick="event.preventDefault();window.location.href='/'">Skyplot</a>
    <a href="/history.html">History</a>
    <a href="/" onclick="event.preventDefault();window.location.href='/'">Network Map</a>
  </nav>
</header>
<main>
  <div id="globe3d"></div>
  <div class="loading" id="loading">Loading 3D globe…</div>
  <div class="panel" id="panel" style="display:none;">
    <div class="stat gps"><span class="label">GPS</span><span class="value" id="gGPS">—</span></div>
    <div class="stat glo"><span class="label">GLONASS</span><span class="value" id="gGLO">—</span></div>
    <div class="stat gal"><span class="label">Galileo</span><span class="value" id="gGAL">—</span></div>
    <div class="stat bds"><span class="label">BeiDou</span><span class="value" id="gBDS">—</span></div>
    <div class="stat"><span class="label">Total Visible</span><span class="value" id="gTOT">—</span></div>
    <div class="stat"><span class="label">Uplink</span><span class="value" id="vUP">—</span></div>
    <div class="stat"><span class="label">GNSS Raw</span><span class="value" id="vGNSS">—</span></div>
    <div class="stat"><span class="label">WiFi</span><span class="value" id="vWIFI">—</span></div>
  </div>
  <div id="legend"></div>
</main>

<script>
const COLORS = { GPS: '#22c55e', GLONASS: '#f59e0b', Galileo: '#8b5cf6', BeiDou: '#ef4444' };
const EARTH_RADIUS = 6371; // km

let skyplotData = null;
let telemetryData = null;
let plotlyReady = false;
let neighborStations = [];

function fmtTime(ts) { return new Date(ts).toLocaleTimeString(); }

function azElToEcef(lat, lng, elev, az, el, range) {
  // Convert lat/lng/elev to ECEF
  const latRad = lat * Math.PI / 180;
  const lngRad = lng * Math.PI / 180;
  const azRad = az * Math.PI / 180;
  const elRad = el * Math.PI / 180;
  
  // Station ECEF
  const N = EARTH_RADIUS / Math.sqrt(1 - 0.00669438 * Math.sin(latRad) ** 2);
  const stationX = (N + elev) * Math.cos(latRad) * Math.cos(lngRad);
  const stationY = (N + elev) * Math.cos(latRad) * Math.sin(lngRad);
  const stationZ = (N * (1 - 0.00669438) + elev) * Math.sin(latRad);
  
  // ENU to ECEF rotation matrix
  const sinLat = Math.sin(latRad), cosLat = Math.cos(latRad);
  const sinLng = Math.sin(lngRad), cosLng = Math.cos(lngRad);
  
  // Local ENU vector
  const east = range * Math.cos(elRad) * Math.sin(azRad);
  const north = range * Math.cos(elRad) * Math.cos(azRad);
  const up = range * Math.sin(elRad);
  
  // Convert to ECEF
  const x = -sinLng * east - sinLat * cosLng * north + cosLat * cosLng * up;
  const y = cosLng * east - sinLat * sinLng * north + cosLat * sinLng * up;
  const z = cosLat * north + sinLat * up;
  
  return [stationX + x, stationY + y, stationZ + z];
}

function buildEarthWireframe() {
  const pts = 36;
  const latLines = 9;
  const lonLines = 18;
  const traces = [];
  
  // Latitude lines
  for (let i = 1; i < latLines; i++) {
    const lat = -90 + i * 180 / latLines;
    const latRad = lat * Math.PI / 180;
    const r = EARTH_RADIUS * Math.cos(latRad);
    const z = EARTH_RADIUS * Math.sin(latRad);
    const xs = [], ys = [], zs = [];
    for (let j = 0; j <= pts; j++) {
      const lng = j * 360 / pts;
      const lngRad = lng * Math.PI / 180;
      xs.push(r * Math.cos(lngRad));
      ys.push(r * Math.sin(lngRad));
      zs.push(z);
    }
    traces.push({
      x: xs, y: ys, z: zs,
      type: 'scatter3d', mode: 'lines',
      line: { color: 'rgba(56,189,248,0.15)', width: 1 },
      hoverinfo: 'skip', showlegend: false
    });
  }
  
  // Longitude lines
  for (let i = 0; i < lonLines; i++) {
    const lng = i * 360 / lonLines;
    const lngRad = lng * Math.PI / 180;
    const xs = [], ys = [], zs = [];
    for (let j = 0; j <= pts; j++) {
      const lat = -90 + j * 180 / pts;
      const latRad = lat * Math.PI / 180;
      const r = EARTH_RADIUS * Math.cos(latRad);
      xs.push(r * Math.cos(lngRad));
      ys.push(r * Math.sin(lngRad));
      zs.push(EARTH_RADIUS * Math.sin(latRad));
    }
    traces.push({
      x: xs, y: ys, z: zs,
      type: 'scatter3d', mode: 'lines',
      line: { color: 'rgba(56,189,248,0.1)', width: 1 },
      hoverinfo: 'skip', showlegend: false
    });
  }
  return traces;
}

function buildStationMarkers() {
  const traces = [];
  const station = { lat: 46.104, lng: -64.755, elev: 100 };
  
  // Our base station
  const [sx, sy, sz] = azElToEcef(station.lat, station.lng, station.elev / 1000, 0, 90, 0);
  traces.push({
    x: [sx], y: [sy], z: [sz],
    type: 'scatter3d', mode: 'markers+text', render_mode: 'webgl',
    marker: { size: 10, color: '#06b6d4', symbol: 'diamond', line: { color: '#000', width: 2 } },
    text: ['● #1087 MONCTON'], textposition: 'top center', textfont: { size: 11, color: '#06b6d4', family: 'system-ui' },
    name: 'Our Base', hoverinfo: 'text', showlegend: true, legendgroup: 'stations'
  });
  
  // Neighbor stations
  for (const n of neighborStations) {
    const [nx, ny, nz] = azElToEcef(n.lat, n.lng, 0.1, 0, 90, 0);
    const color = n.status === 'ONLINE' ? '#22c55e' : n.status === 'ACTIVE' ? '#f59e0b' : '#ef4444';
    traces.push({
      x: [nx], y: [ny], z: [nz],
      type: 'scatter3d', mode: 'markers', render_mode: 'webgl',
      marker: { size: 6, color, symbol: 'circle', line: { color: '#000', width: 1 } },
      name: `#${n.station_id} (${n.status})`, hoverinfo: 'name', showlegend: false, legendgroup: 'neighbors'
    });
  }
  return traces;
}

function buildSatelliteMarkers() {
  if (!skyplotData?.ok || !skyplotData.visible) return [];
  
  const station = { lat: 46.104, lng: -64.755, elev: 0.1 };
  const traces = [];
  const byConst = {};
  
  for (const v of skyplotData.visible) {
    if (!Number.isFinite(v.azimuth) || !Number.isFinite(v.elevation) || v.elevation < 0) continue;
    const constName = v.constellation;
    if (!byConst[constName]) byConst[constName] = { xs: [], ys: [], zs: [], names: [], azs: [], els: [], dists: [] };
    const [x, y, z] = azElToEcef(station.lat, station.lng, station.elev, v.azimuth, v.elevation, v.distance_km);
    byConst[constName].xs.push(x);
    byConst[constName].ys.push(y);
    byConst[constName].zs.push(z);
    byConst[constName].names.push(`${constName[0]}${v.id || ''}`);
    byConst[constName].azs.push(v.azimuth);
    byConst[constName].els.push(v.elevation);
    byConst[constName].dists.push(v.distance_km);
  }
  
  for (const [constName, data] of Object.entries(byConst)) {
    traces.push({
      x: data.xs, y: data.ys, z: data.zs,
      type: 'scatter3d', mode: 'markers+text', render_mode: 'webgl',
      marker: { size: 6, color: COLORS[constName] || '#888', symbol: 'circle', line: { color: '#fff', width: 1 } },
      text: data.names, textposition: 'top center', textfont: { size: 9, color: COLORS[constName] || '#888', family: 'system-ui' },
      name: constName, hoverinfo: 'text',
      hovertext: data.names.map((n, i) => `${n}<br>Az: ${data.azs[i].toFixed(1)}°<br>El: ${data.els[i].toFixed(1)}°<br>Dist: ${data.dists[i].toFixed(0)} km`),
      showlegend: true, legendgroup: 'satellites'
    });
  }
  return traces;
}

function updateGlobe() {
  if (!plotlyReady) return;
  
  const traces = [
    ...buildEarthWireframe(),
    ...buildStationMarkers(),
    ...buildSatelliteMarkers()
  ];
  
  Plotly.react('globe3d', traces, {
    scene: {
      xaxis: { visible: false, showgrid: false, zeroline: false },
      yaxis: { visible: false, showgrid: false, zeroline: false },
      zaxis: { visible: false, showgrid: false, zeroline: false },
      bgcolor: '#0f172a',
      camera: { eye: { x: 1.5, y: 1.5, z: 1.2 } },
      aspectmode: 'data'
    },
    margin: { l: 0, r: 0, t: 0, b: 0 },
    paper_bgcolor: '#0f172a',
    plot_bgcolor: '#0f172a',
    font: { color: '#f8fafc', size: 11 },
    showlegend: true,
    legend: {
      x: 0.01, y: 0.99, xanchor: 'left', yanchor: 'top',
      bgcolor: 'rgba(15,23,42,0.9)', bordercolor: 'rgba(148,163,184,0.3)', borderwidth: 1,
      font: { size: 11, color: '#e2e8f0' },
      itemsizing: 'constant'
    }
  }, { responsive: true, displayModeBar: false });
}

function updateUI() {
  if (!skyplotData?.ok) return;
  const counts = skyplotData.by_constellation || {};
  document.getElementById('gGPS').textContent = counts.GPS ?? 0;
  document.getElementById('gGLO').textContent = counts.GLONASS ?? 0;
  document.getElementById('gGAL').textContent = counts.Galileo ?? 0;
  document.getElementById('gBDS').textContent = counts.BeiDou ?? 0;
  document.getElementById('gTOT').textContent = skyplotData.total_visible ?? 0;
  updateTelemetryUI();
}

function updateTelemetryUI() {
  if (!telemetryData?.ok) return;
  const s = telemetryData.stream;
  if (s) {
    document.getElementById('vUP').textContent = s.uplink_rate ? s.uplink_rate.toFixed(1) + ' bps' : '—';
    document.getElementById('vGNSS').textContent = s.gnss_rate ? s.gnss_rate.toFixed(1) + ' bps' : '—';
    document.getElementById('vWIFI').textContent = s.wifi_strength ? s.wifi_strength + ' dBm' : '—';
  }
  document.getElementById('panel').style.borderColor = telemetryData.ok ? 'rgba(34,197,94,.5)' : 'rgba(239,68,68,.5)';
  document.getElementById('panel').style.display = 'flex';
}

async function loadNeighbors() {
  try {
    const res = await fetch('/api/network', { cache: 'no-store' });
    const data = await res.json();
    if (data.ok && data.neighbours) neighborStations = data.neighbours.slice(0, 20);
  } catch (e) { console.warn('neighbors:', e); }
}

async function refreshAll() {
  try {
    const [skyRes, telRes] = await Promise.all([
      fetch('/api/skyplot', { cache: 'no-store' }),
      fetch('/api/live-telemetry', { cache: 'no-store' })
    ]);
    skyplotData = await skyRes.json();
    telemetryData = await telRes.json();
    updateUI();
    updateGlobe();
    document.getElementById('loading').style.display = 'none';
  } catch (e) { console.error('refreshAll:', e); }
}

async function refreshTelemetry() {
  try {
    const res = await fetch('/api/live-telemetry', { cache: 'no-store' });
    telemetryData = await res.json();
    updateTelemetryUI();
  } catch (e) { console.error('telemetry:', e); }
}

async function init() {
  await loadNeighbors();
  await refreshAll();
  setInterval(refreshAll, 30000);
  setInterval(refreshTelemetry, 4000);
}

// Wait for Plotly to load
function checkPlotly() {
  if (typeof Plotly !== 'undefined') {
    plotlyReady = true;
    init();
  } else {
    setTimeout(checkPlotly, 100);
  }
}
checkPlotly();
</script>
</body>
</html>
